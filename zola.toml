# Zola configuration for Finn Rutis' technical blog
# Docs: https://www.getzola.org/documentation/getting-started/configuration/

base_url = "https://blog.finnrut.is/"
title = "Finn Rutis"
description = "Technical writings by Finn Rutis"
author = "Finn Rutis"
default_language = "en"

# Minify generated HTML (whitespace, comments). Preserves <pre>/<code> and does
# not touch <script type="application/ld+json"> or the XML feeds.
minify_html = true

# Feeds — generated by the homepage section (see content/_index.md) and by each
# tag. Both formats are emitted from the same page list: Atom for readers that
# prefer it, RSS 2.0 for the long tail that still only speaks RSS. Templates are
# local overrides (templates/{atom,rss}.xml), not Zola's built-ins.
generate_feeds = false
feed_filenames = ["atom.xml", "rss.xml"]

# Tags taxonomy — front-matter `tags:` lists become clickable cross-links.
# See templates/tags/{list,single}.html. Per-tag feeds are generated at
# /tags/<slug>/{atom,rss}.xml (both linked from the tag listing pages).
taxonomies = [
    {name = "tags", feed = true}
]

# Exclude paginated section index pages from sitemap.xml — keeps the sitemap
# clean (one entry per real page) instead of N entries per section. Supported
# by Zola 0.22+.
exclude_paginated_pages_in_sitemap = "all"

# Syntax highlighting (Zola 0.22+ uses [markdown.highlighting])
[markdown]
github_alerts = true

# style = "class" emits z-* token classes; colors come entirely from
# static/giallo-{light,dark}.css (Gruvbox). The theme names below are only a
# fallback if style is switched to inline/enriched — Zola 0.22 ships no
# "gruvbox" theme, so keep the bundled github pair to stay build-green.
[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"
error_on_missing_language = true

[extra]
# Site-wide extra data accessible in templates via config.extra
og_image = "og.png"
author_url = "https://blog.finnrut.is/about/"
author_github = "https://github.com/Multipixelone"
author_twitter = "@Multipixelone"
author_email = "me@finnrut.is"
pronouns = "they/them"

# Source repository. The footer's build badge links here — at the exact commit
# the site was built from when the build passes SITE_COMMIT (flake.nix sets it
# from the flake's git revision), and at the repo root otherwise.
repo_url = "https://github.com/Multipixelone/blog"

# OpenPGP key identity, read by templates/pgp.html, templates/about.html and the
# pgp_fingerprint shortcode. `fingerprint_pretty` keeps gpg's double space in
# the middle; it renders inside <code>, which minify_html leaves alone.
# `key_file` names a file under static/ holding the armored key, read
# *optionally*: the PGP page's download button and key block appear only when it
# exists, so removing it degrades the page to the fingerprint and the fetch
# instructions rather than leaving a dead download link. Re-export with
# (the --comment headers are informational armor headers, not signed data):
#   gpg --armor \
#       --comment 'Finn Rutis <me@finnrut.is>' \
#       --comment 'A673 0AC1 3BDD F8FF 95E4  5173 59BF 38D0 5371 C5E9' \
#       --export 0x59BF38D05371C5E9 > static/pgp.asc
[extra.pgp]
fingerprint = "A6730AC13BDDF8FF95E4517359BF38D05371C5E9"
fingerprint_pretty = "A673 0AC1 3BDD F8FF 95E4  5173 59BF 38D0 5371 C5E9"
key_file = "pgp.asc"

# Places Finn can be found. Rendered as the footer icon row (entries with
# `footer = true`) and as the About page's "Elsewhere" list. To add somewhere
# new: append a block here, and add a matching `icon` arm to
# templates/macros/icons.html if the name isn't one it already draws
# (github, x, resume, mail, key, rss, commit, download; anything else falls
# back to a generic link glyph).
[[extra.profiles]]
name = "GitHub"
handle = "@Multipixelone"
url = "https://github.com/Multipixelone"
icon = "github"
footer = true

[[extra.profiles]]
name = "X"
handle = "@Multipixelone"
url = "https://x.com/Multipixelone"
icon = "x"
footer = true

[[extra.profiles]]
name = "Resume"
handle = "resume.finnrut.is"
url = "https://resume.finnrut.is/"
icon = "resume"
footer = true

[[extra.profiles]]
name = "Email"
handle = "me@finnrut.is"
url = "mailto:me@finnrut.is"
icon = "mail"
footer = true
