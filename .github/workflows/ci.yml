name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: flake check
    runs-on: ubuntu-latest
    steps:
      # Full history: the flake reads `self.rev` for the footer's build badge,
      # which needs a non-shallow, clean checkout to resolve.
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - uses: nixbuild/nix-quick-install-action@v35
      - name: Run nix flake check
        run: nix flake check --print-build-logs
      - name: Build site
        run: nix build .#default --print-build-logs
      - name: Check internal links
        run: nix develop --command zola check
      - name: Spell check
        run: nix run nixpkgs#typos -- .
      # Catches the class of bug where a post ships another post's metadata.
      - name: Front-matter consistency
        run: nix develop --command python3 scripts/check_frontmatter.py content

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: nixbuild/nix-quick-install-action@v35
      # Build a copy whose absolute URLs resolve to the local audit server, so
      # Lighthouse/pa11y exercise the real generated HTML and assets.
      - name: Build site (localhost base_url)
        # Mirror the real build's footer badge so the audited HTML matches what
        # ships (the nix build gets this from the flake's `self.rev` instead).
        env:
          SITE_COMMIT: ${{ github.sha }}
        run: nix develop --command zola build --base-url http://localhost:8080 --output-dir ./public
      # /search/ loads its assets from /pagefind/, which only exists once the
      # index is built. Without this the audited search page is a dead end.
      - name: Build search index
        run: nix develop --command pagefind --site ./public
      # The feed templates are hand-maintained overrides and their comments
      # record that byte-level XML problems have shipped before. Also renders
      # every feed through the XSL, so a broken stylesheet fails here rather
      # than in someone's browser.
      - name: Validate feeds
        run: |
          nix develop --command python3 scripts/check_feeds.py ./public
          nix develop --command bash -c '
            set -e
            for feed in ./public/atom.xml ./public/rss.xml ./public/tags/*/atom.xml; do
              xsltproc static/feed.xsl "$feed" > /dev/null
            done
          '
      - name: Serve site
        run: |
          nohup python3 -m http.server 8080 --directory ./public >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/ >/dev/null && break; sleep 1; done
      # Accessibility: audits every page in the sitemap. Blocks on real a11y errors.
      - name: Accessibility (pa11y-ci)
        run: npx --yes pa11y-ci --sitemap http://localhost:8080/sitemap.xml
      # Lighthouse: a11y + SEO block (minScore 0.9); perf + best-practices warn
      # (network/font variance). See .github/lighthouserc.json.
      #
      # One URL per distinct template, since a template that nothing audits is a
      # template whose regressions nobody catches. /search/ is deliberately
      # absent: it is noindex and empty until someone types, so there is nothing
      # for the SEO or a11y categories to judge.
      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/
            http://localhost:8080/nixos-for-who/
            http://localhost:8080/tags/
            http://localhost:8080/tags/nix/
            http://localhost:8080/archive/
            http://localhost:8080/about/
          configPath: .github/lighthouserc.json
      # External links can break or rate-limit outside our control, so report
      # but don't fail the build.
      - name: External links (lychee)
        continue-on-error: true
        run: nix run nixpkgs#lychee -- --no-progress 'content/**/*.md'
