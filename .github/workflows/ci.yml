name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: flake check
    runs-on: ubuntu-latest
    steps:
      # Full history: the flake reads `self.rev` for the footer's build badge,
      # which needs a non-shallow, clean checkout to resolve.
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - uses: nixbuild/nix-quick-install-action@v35
      - name: Run nix flake check
        run: nix flake check --print-build-logs
      - name: Build site
        run: nix build .#default --print-build-logs
      - name: Check internal links
        run: nix develop --command zola check
      - name: Spell check
        run: nix run nixpkgs#typos -- .
      # Catches the class of bug where a post ships another post's metadata.
      # On PRs it also warns (without failing) about a post whose body changed
      # without `updated` moving with it.
      - name: Front-matter consistency
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            nix develop --command python3 scripts/check_frontmatter.py content --since "$BASE"
          else
            nix develop --command python3 scripts/check_frontmatter.py content
          fi
      # Nothing else in CI looks at the cards, so a Pillow/FreeType/font bump
      # could change how they render without failing anything.
      - name: Social card render
        run: nix develop --command python3 scripts/check_og_render.py

  audit:
    name: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only used by the preview comment at the end, and only on PRs from this
      # repo — a fork's token is read-only and the step is skipped for it.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: nixbuild/nix-quick-install-action@v35
      # Build a copy whose absolute URLs resolve to the local audit server, so
      # Lighthouse/pa11y exercise the real generated HTML and assets.
      - name: Build site (localhost base_url)
        # Mirror the real build's footer badge so the audited HTML matches what
        # ships (the nix build gets this from the flake's `self.rev` instead).
        env:
          SITE_COMMIT: ${{ github.sha }}
        run: nix develop --command bash scripts/build.sh ./public http://localhost:8080
      # The feed templates are hand-maintained overrides and their comments
      # record that byte-level XML problems have shipped before. Also renders
      # every feed through the XSL, so a broken stylesheet fails here rather
      # than in someone's browser.
      - name: Validate feeds
        run: |
          nix develop --command python3 scripts/check_feeds.py ./public
          nix develop --command bash -c '
            set -e
            for feed in ./public/atom.xml ./public/rss.xml ./public/tags/*/atom.xml; do
              xsltproc static/feed.xsl "$feed" > /dev/null
            done
          '
      - name: Serve site
        run: |
          nohup python3 -m http.server 8080 --directory ./public >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/ >/dev/null && break; sleep 1; done
      # Accessibility: audits every page in the sitemap. Blocks on real a11y errors.
      - name: Accessibility (pa11y-ci)
        run: npx --yes pa11y-ci --sitemap http://localhost:8080/sitemap.xml
      # Lighthouse: a11y + SEO block (minScore 0.9); perf + best-practices warn
      # (network/font variance). See .github/lighthouserc.json.
      #
      # One URL per distinct template, since a template that nothing audits is a
      # template whose regressions nobody catches. /search/ is deliberately
      # absent: it is noindex and empty until someone types, so there is nothing
      # for the SEO or a11y categories to judge.
      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/
            http://localhost:8080/nixos-for-who/
            http://localhost:8080/tags/
            http://localhost:8080/tags/nix/
            http://localhost:8080/archive/
            http://localhost:8080/about/
          configPath: .github/lighthouserc.json
      # External links can break or rate-limit outside our control, so report
      # but don't fail the build. The weekly Maintenance workflow runs the same
      # check against the built site and files an issue when it finds rot.
      - name: External links (lychee)
        continue-on-error: true
        run: nix run nixpkgs#lychee -- --no-progress 'content/**/*.md'

      # Reviewers can read a diff but can't see the site it produces. The build
      # already exists and already points its absolute URLs at localhost:8080,
      # so it is self-contained: download, serve, look.
      - name: Upload preview build
        id: preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-${{ github.event.pull_request.number }}
          path: ./public
          retention-days: 14

      # Skipped for forks: their GITHUB_TOKEN is read-only, so this would fail
      # the run over a comment.
      - name: Link the preview on the PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          marker='<!-- ci:preview -->'
          body=$(cat <<EOF
          $marker
          ### Preview build

          [Download the built site]($ARTIFACT_URL) (kept for 14 days), unzip it
          and serve it:

          \`\`\`sh
          python3 -m http.server 8080 -d site-preview-$PR
          \`\`\`

          Then open <http://localhost:8080/>. Absolute URLs in this build point
          at \`localhost:8080\`, so it stands alone — apart from the webfonts,
          which come from R2 here exactly as they do in production.

          Built from ${{ github.event.pull_request.head.sha }}.
          EOF
          )
          # One comment, edited in place, rather than a new one per push.
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
                --jq "[.[] | select(.body | contains(\"$marker\")) | .id] | first // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body"
          else
            gh pr comment "$PR" --body "$body"
          fi
